[workspace]

[package]
name = "vsql_mcp"
version = "0.0.5"
edition = "2021"
description = "VillageSQL extension: expose a database as a Model Context Protocol (MCP) server"
license = "GPL-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
villagesql = { path = "../vsql-rust-sdk/villagesql" }
serde_json = "1"
tiny_http = { version = "0.12", features = ["ssl-rustls"] }
# Already in the tree via tiny_http's ssl-rustls feature; named directly so the
# TLS material can be checked before it is handed to the listener.
rustls = "0.20"
rustls-pemfile = "0.2"
webpki = "0.22"
mysql = { version = "28", default-features = false, features = ["minimal"] }
