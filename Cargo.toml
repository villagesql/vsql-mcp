[workspace]

[package]
name = "vsql_mcp"
version = "0.0.12"
edition = "2021"
rust-version = "1.88"
description = "VillageSQL extension: expose a database as a Model Context Protocol (MCP) server"
license = "GPL-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
villagesql = "0.0.7"
serde_json = "1"
base64 = "0.22"
tiny_http = "0.12"
mysql = { version = "28", default-features = false, features = ["minimal"] }
